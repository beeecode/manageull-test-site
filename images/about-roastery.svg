<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="aboutTitle">
  <title id="aboutTitle">Illustration of the small drum roaster and burlap sacks of green coffee inside the Riverside Coffee Co. roastery</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1e3d0"/>
      <stop offset="100%" stop-color="#e4d3bd"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a5a34"/>
      <stop offset="100%" stop-color="#4a3324"/>
    </linearGradient>
    <linearGradient id="sack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a877"/>
      <stop offset="100%" stop-color="#a9835a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="640" fill="url(#wall)"/>
  <rect x="0" y="470" width="800" height="170" fill="#c9b7a1" opacity="0.5"/>
  <rect x="0" y="466" width="800" height="8" fill="#a9835a"/>

  <!-- roaster body -->
  <g>
    <rect x="220" y="300" width="220" height="150" rx="10" fill="#3b2a20"/>
    <circle cx="330" cy="375" r="70" fill="url(#drum)" stroke="#3b2a20" stroke-width="6"/>
    <circle cx="330" cy="375" r="46" fill="#2c1f16"/>
    <circle cx="330" cy="375" r="46" fill="none" stroke="#8a5a34" stroke-width="4" opacity="0.6"/>
    <rect x="440" y="330" width="18" height="60" fill="#2c1f16"/>
    <rect x="200" y="440" width="260" height="16" rx="4" fill="#2c1f16"/>
    <rect x="230" y="456" width="24" height="30" fill="#2c1f16"/>
    <rect x="406" y="456" width="24" height="30" fill="#2c1f16"/>
    <circle cx="260" cy="330" r="7" fill="#c1673b"/>
    <circle cx="285" cy="330" r="7" fill="#7a8b69"/>
  </g>

  <!-- chimney / steam pipe -->
  <rect x="410" y="230" width="20" height="100" fill="#4a3324"/>
  <path d="M420 230 q-10 -30 10 -55" stroke="#c9b7a1" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- burlap sacks -->
  <g>
    <path d="M540 460 q-10 -110 70 -130 q70 20 60 130 z" fill="url(#sack)" stroke="#7a5c38" stroke-width="4"/>
    <path d="M560 350 q40 -12 80 0" stroke="#7a5c38" stroke-width="4" fill="none"/>
    <text x="575" y="410" font-family="Georgia, serif" font-size="20" fill="#4a3324" opacity="0.7">RCC</text>
  </g>
  <g>
    <path d="M120 460 q-8 -90 55 -105 q58 15 50 105 z" fill="url(#sack)" stroke="#7a5c38" stroke-width="4"/>
    <path d="M138 375 q32 -10 64 0" stroke="#7a5c38" stroke-width="4" fill="none"/>
  </g>

  <!-- scattered beans -->
  <g fill="#4a3324">
    <ellipse cx="500" cy="470" rx="9" ry="6"/>
    <ellipse cx="518" cy="480" rx="9" ry="6"/>
    <ellipse cx="490" cy="486" rx="9" ry="6"/>
    <ellipse cx="200" cy="475" rx="9" ry="6"/>
    <ellipse cx="220" cy="486" rx="9" ry="6"/>
  </g>

  <!-- floor line -->
  <rect x="0" y="560" width="800" height="80" fill="#a9835a" opacity="0.5"/>
</svg>
